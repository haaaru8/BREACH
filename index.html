<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BREACH v0.1</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b111b;color:white;font-family:system-ui;touch-action:none}canvas{display:block}#hud{position:fixed;top:14px;left:15px;font-weight:700;text-shadow:0 2px 4px #000;pointer-events:none}#hint{position:fixed;top:45px;left:15px;font-size:12px;color:#b9d3e8;pointer-events:none}#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;pointer-events:none}#pad{position:fixed;bottom:30px;left:25px;width:138px;height:138px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff16;touch-action:none}#nub{position:absolute;left:49px;top:49px;width:40px;height:40px;border-radius:50%;background:#8cd4ff99}#look{position:fixed;right:15px;bottom:18px;width:42%;height:45%;border:1px solid #ffffff20;border-radius:16px;background:#ffffff08;touch-action:none}#looklabel{position:absolute;right:14px;bottom:10px;font-size:12px;color:#ffffff88;pointer-events:none}#status{position:fixed;top:14px;right:14px;font-size:12px;color:#a7c9d9}</style></head><body><div id="hud">BREACH <span style="color:#67d7ff">v0.1</span></div><div id="hint">左：移動　右：視点操作　／　PC：WASD + ドラッグ</div><div id="status">TRAINING FACILITY</div><div id="cross">+</div><div id="pad"><div id="nub"></div></div><div id="look"><div id="looklabel">LOOK</div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101c2b);scene.fog=new THREE.Fog(0x101c2b,12,65);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,100);camera.position.set(0,1.65,7);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xaadfff,0x223344,1.7));const light=new THREE.DirectionalLight(0xffffff,1.5);light.position.set(-4,10,5);scene.add(light);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.83});const wall=mat(0x516576),floor=mat(0x263442),trim=mat(0x1c2735),door=mat(0x287f99),crate=mat(0x8b7054);
const solids=[];function block(x,y,z,w,h,d,m,solid=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);if(solid)solids.push({x,z,w,d});return o}
block(0,-.2,0,30,.4,30,floor,false);for(let x=-14;x<=14;x+=2){block(x,.012,0,.035,.025,30,trim,false)}for(let z=-14;z<=14;z+=2){block(0,.016,z,30,.025,.035,trim,false)}
block(-15,2,0,.5,4,30,wall);block(15,2,0,.5,4,30,wall);block(0,2,-15,30,4,.5,wall);block(-9,2,15,12,4,.5,wall);block(9,2,15,12,4,.5,wall);
block(-6,2,-5,.5,4,16,wall);block(6,2,-5,.5,4,16,wall);block(0,2,-13,12,4,.5,wall);block(-3,2,-7,6,4,.5,wall);block(3,2,-7,6,4,.5,wall);
block(0,1.65,-14,.16,3,1.5,door,false);block(-10,1,-2,2,2,2,crate);block(10,1,4,2,2,2,crate);block(-10,1,9,2,2,2,crate);block(10,1,-9,2,2,2,crate);
for(const [x,z] of [[-12,-12],[12,-12],[-12,12],[12,12],[0,0]]){const lamp=new THREE.PointLight(0x69cfff,2,9);lamp.position.set(x,3.3,z);scene.add(lamp);block(x,3.75,z,1,.15,1,door,false)}
let yaw=0,pitch=0;const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const pad=document.getElementById('pad'),nub=document.getElementById('nub');let joyX=0,joyY=0,pid=null;function movePad(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.max(1,Math.hypot(dx,dy)),scale=Math.min(48,len)/len;joyX=dx*scale/48;joyY=dy*scale/48;nub.style.transform=`translate(${joyX*48}px,${joyY*48}px)`}pad.addEventListener('pointerdown',e=>{pid=e.pointerId;pad.setPointerCapture(pid);movePad(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)movePad(e)});function stop(e){if(e.pointerId!==pid)return;pid=null;joyX=joyY=0;nub.style.transform=''}pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);
const look=document.getElementById('look');let lid=null,lx=0,ly=0;look.addEventListener('pointerdown',e=>{lid=e.pointerId;lx=e.clientX;ly=e.clientY;look.setPointerCapture(lid)});look.addEventListener('pointermove',e=>{if(e.pointerId!==lid)return;yaw-=(e.clientX-lx)*.005;pitch=Math.max(-1.35,Math.min(1.35,pitch-(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY});look.addEventListener('pointerup',()=>lid=null);look.addEventListener('pointercancel',()=>lid=null);
let mouse=false;renderer.domElement.addEventListener('pointerdown',e=>{mouse=true;lx=e.clientX;ly=e.clientY});renderer.domElement.addEventListener('pointermove',e=>{if(!mouse)return;yaw-=(e.clientX-lx)*.005;pitch=Math.max(-1.35,Math.min(1.35,pitch-(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY});addEventListener('pointerup',()=>mouse=false);
function blocked(x,z){if(Math.abs(x)>14.5||Math.abs(z)>14.5)return true;return solids.some(b=>Math.abs(x-b.x)<b.w/2+.35&&Math.abs(z-b.z)<b.d/2+.35)}let prev=performance.now();function tick(now){requestAnimationFrame(tick);const dt=Math.min((now-prev)/1000,.05);prev=now;const forward=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joyY;const strafe=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joyX;const norm=Math.max(1,Math.hypot(forward,strafe)),f=forward/norm,s=strafe/norm,spd=4.3*dt;const dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*spd,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*spd;const nx=camera.position.x+dx,nz=camera.position.z+dz;if(!blocked(nx,camera.position.z))camera.position.x=nx;if(!blocked(camera.position.x,nz))camera.position.z=nz;camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;renderer.render(scene,camera)}requestAnimationFrame(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
