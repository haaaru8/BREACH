<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BREACH v0.2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b111b;color:white;font-family:system-ui;touch-action:none}canvas{display:block}#hud{position:fixed;top:14px;left:15px;font-weight:700;text-shadow:0 2px 4px #000;pointer-events:none}#hint{position:fixed;top:45px;left:15px;font-size:12px;color:#b9d3e8;pointer-events:none}#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;pointer-events:none}#pad{position:fixed;bottom:30px;left:25px;width:138px;height:138px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff16;touch-action:none}#nub{position:absolute;left:49px;top:49px;width:40px;height:40px;border-radius:50%;background:#8cd4ff99}#look{position:fixed;right:15px;bottom:18px;width:42%;height:45%;border:1px solid #ffffff20;border-radius:16px;background:#ffffff08;touch-action:none}#looklabel{position:absolute;right:14px;bottom:10px;font-size:12px;color:#ffffff88;pointer-events:none}#combat{position:fixed;top:72px;left:15px;font-size:14px;line-height:1.65;text-shadow:0 2px 4px #000;pointer-events:none}#fire{position:fixed;right:28px;bottom:36px;width:88px;height:88px;border:2px solid #ffb8a4;border-radius:50%;background:#d84b4780;color:white;font-weight:800;font-size:18px;touch-action:none;z-index:5}#reload{position:fixed;right:132px;bottom:43px;padding:13px;border:1px solid #fff7;border-radius:12px;background:#243d56;color:white;z-index:5}#weapon{position:fixed;right:28px;top:72px;padding:10px;border:1px solid #fff7;border-radius:12px;background:#243d56;color:white;z-index:5}#reset{position:fixed;left:50%;top:58%;transform:translate(-50%,-50%);padding:15px 28px;border:2px solid #fff;border-radius:12px;background:#25465b;color:white;display:none;z-index:10}#message{position:fixed;top:33%;left:50%;transform:translateX(-50%);font-weight:800;font-size:24px;color:#a8f5ff;text-shadow:0 2px 5px black;pointer-events:none}#status{position:fixed;top:14px;right:14px;font-size:12px;color:#a7c9d9}</style></head><body><div id="hud">BREACH <span style="color:#67d7ff">v0.2</span></div><div id="hint">左：移動　右：視点　FIRE：射撃　／　PC：WASD・クリック・R</div><div id="status">TRAINING FACILITY</div><div id="cross">+</div><div id="combat"></div><div id="message"></div><button id="weapon">PISTOL ↔ SMG</button><button id="reload">RELOAD</button><button id="fire">FIRE</button><button id="reset">RESTART</button><div id="pad"><div id="nub"></div></div><div id="look"><div id="looklabel">LOOK</div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101c2b);scene.fog=new THREE.Fog(0x101c2b,12,65);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,100);camera.position.set(0,1.65,7);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xaadfff,0x223344,1.7));const light=new THREE.DirectionalLight(0xffffff,1.5);light.position.set(-4,10,5);scene.add(light);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.83});const wall=mat(0x516576),floor=mat(0x263442),trim=mat(0x1c2735),door=mat(0x287f99),crate=mat(0x8b7054);
const targets=[];const targetMaterial=()=>new THREE.MeshStandardMaterial({color:0xe55a58,emissive:0x421010,roughness:.6});
const solids=[];function block(x,y,z,w,h,d,m,solid=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);if(solid)solids.push({x,z,w,d});return o}
block(0,-.2,0,30,.4,30,floor,false);for(let x=-14;x<=14;x+=2){block(x,.012,0,.035,.025,30,trim,false)}for(let z=-14;z<=14;z+=2){block(0,.016,z,30,.025,.035,trim,false)}
block(-15,2,0,.5,4,30,wall);block(15,2,0,.5,4,30,wall);block(0,2,-15,30,4,.5,wall);block(-9,2,15,12,4,.5,wall);block(9,2,15,12,4,.5,wall);
block(-6,2,-5,.5,4,16,wall);block(6,2,-5,.5,4,16,wall);block(0,2,-13,12,4,.5,wall);block(-3,2,-7,6,4,.5,wall);block(3,2,-7,6,4,.5,wall);
block(0,1.65,-14,.16,3,1.5,door,false);block(-10,1,-2,2,2,2,crate);block(10,1,4,2,2,2,crate);block(-10,1,9,2,2,2,crate);block(10,1,-9,2,2,2,crate);
for(const [x,z] of [[-12,-12],[12,-12],[-12,12],[12,12],[0,0]]){const lamp=new THREE.PointLight(0x69cfff,2,9);lamp.position.set(x,3.3,z);scene.add(lamp);block(x,3.75,z,1,.15,1,door,false)}
// Training dummies: raycastable and destructible, respawn after a short delay.
function spawnTarget(x,z){const group=new THREE.Group();group.position.set(x,0,z);scene.add(group);const torso=new THREE.Mesh(new THREE.BoxGeometry(.85,1.35,.45),targetMaterial());torso.position.y=1.45;group.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.31,12,10),targetMaterial());head.position.y=2.4;group.add(head);const base=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.14,12),mat(0x627889));base.position.y=.12;group.add(base);const t={group,parts:[torso,head],hp:100,alive:true,respawn:0};for(const part of t.parts)part.userData.target=t;targets.push(t)}
spawnTarget(0,-4);spawnTarget(-10,4);spawnTarget(10,-5);
const raycaster=new THREE.Raycaster(), center=new THREE.Vector2(0,0);
const guns=[{name:'PISTOL',damage:34,mag:12,reserve:72,rate:.24,reload:1.35},{name:'SMG',damage:14,mag:30,reserve:180,rate:.09,reload:1.8}];let gunIndex=0;const ammo=[12,30],reserve=[72,180];let hp=100,kills=0,dead=false,reloadUntil=0,nextShot=0,shootHeld=false,flashUntil=0,hitUntil=0,noticeUntil=0;
const combat=document.getElementById('combat'),message=document.getElementById('message'),fire=document.getElementById('fire');
function notice(txt){message.textContent=txt;noticeUntil=performance.now()+900}
function updateHud(){const g=guns[gunIndex];combat.innerHTML=`HP: <b>${hp}</b> / 100<br>WEAPON: ${g.name}<br>AMMO: ${ammo[gunIndex]} / ${reserve[gunIndex]}<br>TARGETS HIT: ${kills}${reloadUntil>performance.now()?'　RELOADING...':''}`;document.getElementById('cross').style.color=performance.now()<hitUntil?'#ff5757':'white'}
function reload(){if(dead||reloadUntil||ammo[gunIndex]>=guns[gunIndex].mag||reserve[gunIndex]<=0)return;reloadUntil=performance.now()+guns[gunIndex].reload*1000;notice('RELOADING')}
function changeGun(){if(dead)return;gunIndex=(gunIndex+1)%guns.length;reloadUntil=0;notice(guns[gunIndex].name)}
function shoot(now){if(dead||reloadUntil||now<nextShot)return;const g=guns[gunIndex];if(ammo[gunIndex]<=0){reload();return}ammo[gunIndex]--;nextShot=now+g.rate*1000;raycaster.setFromCamera(center,camera);raycaster.far=35;const meshes=targets.filter(t=>t.alive).flatMap(t=>t.parts);const hits=raycaster.intersectObjects(meshes,false);if(hits.length){const t=hits[0].object.userData.target;t.hp-=g.damage;hitUntil=now+130;notice('HIT '+Math.max(0,t.hp)+' HP');if(t.hp<=0){t.alive=false;t.group.visible=false;t.respawn=now+4500;kills++;notice('TARGET DOWN!')}}}
fire.addEventListener('pointerdown',e=>{e.preventDefault();fire.setPointerCapture(e.pointerId);shootHeld=true;shoot(performance.now())});const stopFire=()=>shootHeld=false;fire.addEventListener('pointerup',stopFire);fire.addEventListener('pointercancel',stopFire);
document.getElementById('reload').addEventListener('click',reload);document.getElementById('weapon').addEventListener('click',changeGun);
function restart(){hp=100;kills=0;dead=false;ammo[0]=12;ammo[1]=30;reserve[0]=72;reserve[1]=180;reloadUntil=0;gunIndex=0;camera.position.set(0,1.65,7);yaw=pitch=0;document.getElementById('reset').style.display='none';for(const t of targets){t.hp=100;t.alive=true;t.group.visible=true;t.respawn=0}notice('TRAINING START')}
document.getElementById('reset').addEventListener('click',restart);
let lastAttack=performance.now();
let yaw=0,pitch=0;const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')reload();if(e.key==='1')gunIndex=0;if(e.key==='2')gunIndex=1;if(e.code==='Space'){e.preventDefault();shootHeld=true}});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')shootHeld=false});
const pad=document.getElementById('pad'),nub=document.getElementById('nub');let joyX=0,joyY=0,pid=null;function movePad(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.max(1,Math.hypot(dx,dy)),scale=Math.min(48,len)/len;joyX=dx*scale/48;joyY=dy*scale/48;nub.style.transform=`translate(${joyX*48}px,${joyY*48}px)`}pad.addEventListener('pointerdown',e=>{pid=e.pointerId;pad.setPointerCapture(pid);movePad(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)movePad(e)});function stop(e){if(e.pointerId!==pid)return;pid=null;joyX=joyY=0;nub.style.transform=''}pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);
const look=document.getElementById('look');let lid=null,lx=0,ly=0;look.addEventListener('pointerdown',e=>{lid=e.pointerId;lx=e.clientX;ly=e.clientY;look.setPointerCapture(lid)});look.addEventListener('pointermove',e=>{if(e.pointerId!==lid)return;yaw-=(e.clientX-lx)*.005;pitch=Math.max(-1.35,Math.min(1.35,pitch-(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY});look.addEventListener('pointerup',()=>lid=null);look.addEventListener('pointercancel',()=>lid=null);
let mouse=false;renderer.domElement.addEventListener('pointerdown',e=>{mouse=true;lx=e.clientX;ly=e.clientY;if(e.pointerType==='mouse')shoot(performance.now())});renderer.domElement.addEventListener('pointermove',e=>{if(!mouse)return;yaw-=(e.clientX-lx)*.005;pitch=Math.max(-1.35,Math.min(1.35,pitch-(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY});addEventListener('pointerup',()=>mouse=false);
function blocked(x,z){if(Math.abs(x)>14.5||Math.abs(z)>14.5)return true;return solids.some(b=>Math.abs(x-b.x)<b.w/2+.35&&Math.abs(z-b.z)<b.d/2+.35)}let prev=performance.now();function tick(now){requestAnimationFrame(tick);const dt=Math.min((now-prev)/1000,.05);prev=now;
if(reloadUntil&&now>=reloadUntil){const n=Math.min(guns[gunIndex].mag-ammo[gunIndex],reserve[gunIndex]);ammo[gunIndex]+=n;reserve[gunIndex]-=n;reloadUntil=0}
if(shootHeld)shoot(now);for(const t of targets){if(!t.alive&&now>=t.respawn){t.alive=true;t.hp=100;t.group.visible=true}}
if(!dead&&now-lastAttack>2200){lastAttack=now;const close=targets.some(t=>t.alive&&camera.position.distanceTo(new THREE.Vector3(t.group.position.x,1.65,t.group.position.z))<13);if(close){hp=Math.max(0,hp-8);if(hp===0){dead=true;shootHeld=false;document.getElementById('reset').style.display='block';notice('TRAINING FAILED')}}}
if(now>noticeUntil)message.textContent='';updateHud();const forward=dead?0:((keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joyY);const strafe=dead?0:((keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joyX);const norm=Math.max(1,Math.hypot(forward,strafe)),f=forward/norm,s=strafe/norm,spd=4.3*dt;const dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*spd,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*spd;const nx=camera.position.x+dx,nz=camera.position.z+dz;if(!blocked(nx,camera.position.z))camera.position.x=nx;if(!blocked(camera.position.x,nz))camera.position.z=nz;camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;renderer.render(scene,camera)}requestAnimationFrame(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
